[project]
name = "MNutils"
version = "1.1.2"
description = "Utility functions for multinuclear MR data processing"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "dcm2niiw>=0.1.5",
    "ipython>=8.0",
    "loguru>=0.7.3",
    "mat73",
    "matplotlib>=3.10.7",
    "nibabel>=5.3.2",
    "nmrglue>=0.11",
    "pillow>=12.3.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "tailwind-colors>=1.4.1",
    "xmris[fitting]",
]

[project.optional-dependencies]
2025a = ["matlabengine==25.1.*"]
bet = ["hd-bet>=2.0.1", "torch>=2.10.0"]

[project.scripts]
docs-mnutils-api = "mnutils._scripts:docs_api"        # Regenerate quartodoc API stubs
docs-mnutils-notebooks = "mnutils._scripts:docs_notebooks"  # Serve tutorials — blocking
docs-mnutils = "mnutils._scripts:docs_all"            # API refs, then serve site — blocking
test-mnutils-gen = "mnutils._scripts:generate_test_notebooks"  # docs/*.md -> tests/autogen_notebooks/*.ipynb
test-mnutils = "mnutils._scripts:run_tests"           # test-gen, then run the full pytest suite

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.7",
    "matlabengine==25.1.*",
    "nb-clean>=4.0.1",
    "nbmake>=1.5.5",
    "nbstripout>=0.9.1",
    "pydicom>=3.0.1",
    "pyqt6>=6.11.0",
    "pytest>=8.4.1",
    "snakeviz>=2.2.2",
    # --- Documentation (MyST) ---
    "mystmd>=1.3.0",            # Python MyST CLI for docs building
    "quartodoc>=0.11.1",        # Converts code docstrings to markdown
    "griffe<0.40.0",            # Explicit pin to fix quartodoc parsing bug
    "jupyter-server>=2.17.0",   # Required for rendering docs
    "jupytext>=1.19.1",
]

[tool.pytest.ini_options]
addopts = "--capture=no --nbmake"
testpaths = ["tests"]

# [tool.uv]
# config-settings = { editable_mode = "compat" }

[tool.uv.sources]
mat73 = { git = "https://github.com/skjerns/mat7.3" }
xmris = { git = "https://github.com/andrewendlinger/xmris.git" }
# xmris = { path = "../xmris", editable = true }

# --- Ruff (Linter) ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "NPY", "D", "UP"] # Errors, Failures, Isort, NumPy, Docstrings, Upgrade
ignore = ["D100", "D104", "D401"]                  # Ignore missing docstring in public module/package

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Ignore line length, unused imports, and import positions in notebooks/scripts
"docs/**/*.py" = ["E501", "F401", "E402"]
"docs/**/*.ipynb" = ["E501", "F401", "E402"]

# --- Jupytext ---
# Two-way syncing between Jupyter Notebooks (.ipynb) and Markdown (.md) for docs pages.
# Edit in .md (git-friendly) or .ipynb (interactive), but only ever commit .md files.
[tool.jupytext]
formats = "ipynb,md:myst"

# Include display_name to prevent notebook validation errors
notebook_metadata_filter = "-all, kernelspec.name, kernelspec.language, kernelspec.display_name, jupytext.text_representation.extension, jupytext.text_representation.format_name"

# Cell Metadata: strip execution counts/IDs, keep 'tags' (MyST directives) and 'name'.
cell_metadata_filter = "-all, tags, name"
