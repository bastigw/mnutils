name: Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  docs-check:
    name: Docs style
    runs-on: ubuntu-latest
    # Stdlib-only and whole-tree: seconds, so it gets its own job rather than
    # riding the test matrix. A docs failure then reads as a docs failure.
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Errors gate (exit 1) -- each one renders wrong or dies as a link, and
      # `myst build` is silent about all of them. Warnings exit 0 by design:
      # real drift, too judgment-dependent to block a PR on.
      - name: Check docs style
        run: python3 .claude/skills/docs-page/check_docs.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Both halves of ruff, once. `ruff check` used to be the first step of `test`,
    # which meant it ran per matrix leg, a formatting nit stopped the maths from
    # ever running, and the failure reported itself as a test failure. Same
    # reasoning as the docs job above: a lint failure should read as a lint failure.
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      # Format before lint: the mechanical failure is the cheaper one to fix, so
      # it should be the one you see first. `uv run lint` runs these same two.
      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

  bare-install:
    name: bare install
    runs-on: ubuntu-latest
    # Every other job installs with `uv sync` (default group only, no optional
    # extras), so the dependency set a real user receives is exercised nowhere --
    # a submodule that only imports because a dev/test dependency leaked in would
    # pass every other job and still break on a fresh `pip install mnutils`.
    # One Python version is enough: this checks the dependency *set*, not the matrix.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Set up Python
        run: uv python install 3.13

      # Deliberately no --all-extras and no --dev: installing *only*
      # [project].dependencies into a clean venv is the entire point of the job.
      - name: Install the way a user does
        run: uv sync --no-dev

      - name: Import mnutils and run the processing chain
        run: uv run .github/scripts/bare_install_smoke.py

  test:
    runs-on: ubuntu-latest
    # A healthy run is ~4 min; bound it so a hung kernel fails fast, not at GitHub's 6h ceiling.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run Tests
        run: uv run test-mnutils
